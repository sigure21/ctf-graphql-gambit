name: ctf-graphql-gambit-standalone

services:
  evaluator:
    build: .
    command: ["node", "src/evaluator.mjs"]
    environment:
      EVALUATOR_HOST: 0.0.0.0
      EVALUATOR_PORT: 4200
      FLAG: ${FLAG:?FLAG is generated by scripts/ctf.mjs}
      PROXY_SECRET: ${PROXY_SECRET:?PROXY_SECRET is generated by scripts/ctf.mjs}
    networks:
      - backplane
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    user: node
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 48
    mem_limit: 160m
    cpus: 0.75
    ulimits:
      nofile:
        soft: 512
        hard: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  gateway:
    build: .
    command: ["node", "src/gateway.mjs"]
    depends_on:
      evaluator:
        condition: service_healthy
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 3000
      EVALUATOR_HOST: evaluator
      EVALUATOR_PORT: 4200
      PROXY_SECRET: ${PROXY_SECRET:?PROXY_SECRET is generated by scripts/ctf.mjs}
    ports:
      - "127.0.0.1:${GRAPHQL_GAMBIT_PORT:-18081}:3000"
    networks:
      - front
      - backplane
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    user: node
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 48
    mem_limit: 128m
    cpus: 0.50
    ulimits:
      nofile:
        soft: 512
        hard: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

networks:
  front: {}
  backplane:
    internal: true
